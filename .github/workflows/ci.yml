name: Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install development tools
        run: python -m pip install -r requirements-dev.txt
      - name: Check code style
        run: |
          python -m ruff check .
          python -m black --check budget-tracker
      - name: Run tests
        run: python -m pytest

  weather:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: weather-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install requests==2.34.2
      - name: Run weather tests
        run: python -m unittest discover -s tests -v
